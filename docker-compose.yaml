version: '3'

services:
  salt_api_one:
    build: .
    environment:
      - FLASK_APP
      - PROPOSAL_DIR
      - LOGS_DIR
    env_file:
      - .env
    ports:
      - "5001:5001"
    volumes:
      - ${PROPOSAL_DIR}/proposals
      - ${LOGS_DIR}/salt_server_logs
    working_dir: /app
    restart: always